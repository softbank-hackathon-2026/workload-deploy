# Checks the Terraform templates (format, validate, mock-provider tests) and the on-prem Ansible playbooks
# (deployed to the Actions runner itself, which stands in for the VM). No AWS or VM access.
name: Validate

on:
  push:
    branches: [main]
    paths: ["templates/**", "ansible/**", "scripts/**", "tests/**", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["templates/**", "ansible/**", "scripts/**", "tests/**", ".github/workflows/validate.yml"]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        template: [ecs-fargate/basic, ecs-fargate/shared-alb, lambda/basic, ec2/basic]
    defaults:
      run:
        working-directory: templates/${{ matrix.template }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test

  # Runs deploy.yml and remove.yml through Ansible Runner against the runner itself, with the same inputs
  # deploy-vm.yml builds (vm_plan.py), and checks the app answers, then that it is gone.
  vm-playbook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app:
          - { name: python, start: "python3 app.py" }
          - { name: node, start: "node server.js" }
    defaults:
      run:
        shell: bash
    env:
      APPLICATION_ID: vm-check-${{ matrix.app.name }}
      DEPLOYMENT_ID: dep-vm-check
      VM_LOCAL: "true"
      PDD: ${{ runner.temp }}/ansible-run
    steps:
      - uses: actions/checkout@v4

      - name: Script self-tests
        run: |
          python3 scripts/plan.py --self-test
          python3 scripts/vm_plan.py --self-test
          python3 scripts/callback.py --self-test

      - name: Install Ansible Runner
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/pip" install -q "ansible-core>=2.16,<2.18" "ansible-runner>=2.4,<3"
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Deploy test app
        env:
          APP_ARCHIVE: ${{ runner.temp }}/app.tar.gz
          TEST_PLAN: >-
            {"values": {"runtime": "${{ matrix.app.name }}", "app_port": 8080, "health_check_path": "/health",
            "start_command": "${{ matrix.app.start }}", "env": {"APP_ENV": "check"}}}
        run: |
          tar -czf "$APP_ARCHIVE" -C "tests/vm-apps/${{ matrix.app.name }}" .
          python3 scripts/vm_plan.py prepare "$PDD"
          cp -r ansible/playbooks "$PDD/project"
          ansible-runner run "$PDD" -p deploy.yml --json | python3 scripts/callback.py ansible-events
          curl -fsS http://127.0.0.1:8080/health
          systemctl show "sbh-app-$APPLICATION_ID" -p Environment | grep -q "APP_ENV=check"

      - name: Remove test app
        run: |
          rm -rf "$PDD"
          python3 scripts/vm_plan.py remove "$PDD"
          cp -r ansible/playbooks "$PDD/project"
          ansible-runner run "$PDD" -p remove.yml
          ! systemctl is-active --quiet "sbh-app-$APPLICATION_ID"
          [[ ! -d "/opt/sbh-apps/$APPLICATION_ID" ]]
